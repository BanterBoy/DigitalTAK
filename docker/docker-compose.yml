# DigitalTAK -- TAK Server 5.7 Docker Compose
#
# Builds from the official tak.gov Docker release package.
# Application content is COPY'd from takserver-docker-5.7-RELEASE-8/tak/
# at image build time (build context is the repo root).
#
# Usage:
#   cp .env.example .env && edit .env
#   docker compose build
#   docker compose up -d
#   docker exec -it docker-takserver-1 /opt/tak/docker/init-certs.sh
#   docker exec -it docker-takserver-1 bash -c 'cd /opt/tak && java -jar utils/UserManager.jar certmod -A certs/files/admin.pem'
#   docker cp docker-takserver-1:/opt/tak/certs/files/admin.p12 .
#
# Prerequisites:
#   Extract takserver-docker-5.7-RELEASE-8.zip to takserver-docker-5.7-RELEASE-8/
#   in the repo root (sibling to docker/).  Download from https://tak.gov.

services:

  # -- PostgreSQL 15 with PostGIS (official TAK DB image approach) -------------
  tak-database:
    build:
      context: ..
      dockerfile: docker/Dockerfile.db
    image: tak-database:5.7
    environment:
      # envpass is read by takserver-setup-db.sh to set the martiuser DB password
      envpass: ${TAK_DB_PASSWORD}
    volumes:
      - tak_pg_data:/var/lib/postgresql/15/data
    networks:
      - tak_net
    healthcheck:
      test: ["CMD-SHELL", "su postgres -c 'pg_isready -d cot'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  # -- TAK Server 5.7 ----------------------------------------------------------
  takserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: takserver:5.7
    depends_on:
      tak-database:
        condition: service_healthy
    environment:
      TAK_DB_PASSWORD:  ${TAK_DB_PASSWORD}
      # Cert metadata -- consumed by init-certs.sh via docker exec
      TAK_CERT_STATE:   ${TAK_CERT_STATE:-VA}
      TAK_CERT_CITY:    ${TAK_CERT_CITY:-TESTCITY}
      TAK_CERT_ORG:     ${TAK_CERT_ORG:-TESTORG}
      TAK_CERT_OU:      ${TAK_CERT_OU:-TESTUNIT}
      TAK_CERT_CA_NAME: ${TAK_CERT_CA_NAME:-TAK-CA}
      TAK_CERT_PASS:    ${TAK_CERT_PASS:-atakatak}
      POSTGRES_HOST:    tak-database
      POSTGRES_PORT:    5432
    volumes:
      - tak_certs:/opt/tak/certs/files
      - tak_logs:/opt/tak/logs
    ports:
      - "${TAK_PORT_COT:-8089}:8089"
      - "${TAK_PORT_WEB:-8443}:8443"
      - "${TAK_PORT_ENROLL:-8446}:8446"
    networks:
      - tak_net
    healthcheck:
      test: ["CMD-SHELL", "nc -zw3 localhost 8443"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  tak_pg_data:
  tak_certs:
  tak_logs:

networks:
  tak_net: