name: CI

on:
  push:
    branches: [prod, main, dev]
  pull_request:
    branches: [prod, main, dev]
  workflow_dispatch:
    inputs:
      live_vm_host:
        description: 'TAK Server VM IP or hostname (leave blank to skip live-VM tests)'
        required: false
        default: ''
      live_vm_ssh_user:
        description: 'SSH username on the TAK Server VM'
        required: false
        default: 'atak'
      live_vm_tags:
        description: 'Pester tags to run (blank = all integration tests)'
        required: false
        default: ''

# Cancel in-flight runs for the same branch/PR to avoid resource waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal required permissions — jobs that need more declare their own block.
permissions:
  contents: read
  checks: write

jobs:
  # ─── Pester unit tests ──────────────────────────────────────────────────────
  pester:
    name: Pester Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install PowerShell
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -y powershell

      - name: Install Pester and Posh-SSH
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester    -MinimumVersion 5.0 -Force -Scope CurrentUser
          Install-Module Posh-SSH  -Force -Scope CurrentUser

      - name: Run TAKServerPS tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path      = './TAKServerPS/Tests'
          $config.Run.Exit      = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'TestResults-TAKServerPS.xml'
          $config.TestResult.OutputFormat = 'NUnit2.5'
          Invoke-Pester -Configuration $config

      - name: Run TAKInstall tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path      = './TAKInstall/Tests'
          $config.Run.Exit      = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'TestResults-TAKInstall.xml'
          $config.TestResult.OutputFormat = 'NUnit2.5'
          Invoke-Pester -Configuration $config

      - name: Run TAKDeploy tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path      = './TAKDeploy/Tests'
          $config.Run.Exit      = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'TestResults-TAKDeploy.xml'
          $config.TestResult.OutputFormat = 'NUnit2.5'
          Invoke-Pester -Configuration $config

      - name: Run TAKOnboarding tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path      = './TAKOnboarding/Tests'
          $config.Run.Exit      = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'TestResults-TAKOnboarding.xml'
          $config.TestResult.OutputFormat = 'NUnit2.5'
          Invoke-Pester -Configuration $config

      - name: Run DigitalTAKService tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path      = './Modules/DigitalTAKService/Tests'
          $config.Run.Exit      = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'TestResults-DigitalTAKService.xml'
          $config.TestResult.OutputFormat = 'NUnit2.5'
          Invoke-Pester -Configuration $config

      - name: Run PaperclipControl tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path      = './Modules/PaperclipControl/Tests'
          $config.Run.Exit      = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled      = $true
          $config.TestResult.OutputPath   = 'TestResults-PaperclipControl.xml'
          $config.TestResult.OutputFormat = 'NUnit2.5'
          Invoke-Pester -Configuration $config

      - name: Run integration tests (skip without live host)
        shell: pwsh
        run: |
          # TAK_INTEGRATION_HOST is not set in CI, so all tests will be skipped.
          # This step validates that the test infrastructure loads without errors.
          .\Invoke-IntegrationTests.ps1 -OutputPath 'TestResults-Integration.xml' -PassThru | Out-Null

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pester-results
          path: TestResults-*.xml

  # ─── PSScriptAnalyzer lint ──────────────────────────────────────────────────
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    needs: pester
    steps:
      - uses: actions/checkout@v6

      - name: Install PowerShell
        run: |
          wget -q "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update -q
          sudo apt-get install -y powershell

      - name: Lint TAKServerPS, TAKInstall, TAKDeploy and root scripts
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

          # Helper: lint a module's source files, excluding its Tests/ subdirectory.
          # Test files use global: scoped stub functions and Pester patterns that are
          # intentionally non-production style.
          function Invoke-ModuleLint([string]$ModulePath, [string]$Settings) {
              Get-ChildItem -Path $ModulePath -Recurse -Include '*.ps1','*.psm1','*.psd1' |
                  Where-Object { $_.FullName -notmatch '[/\\]Tests[/\\]' -and $_.FullName -notmatch '[/\\]Tests$' } |
                  ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings $Settings }
          }

          $settings = './TAKServerPS/PSScriptAnalyzerSettings.psd1'
          $r1 = Invoke-ModuleLint -ModulePath ./TAKServerPS -Settings $settings
          $settings2 = './TAKInstall/PSScriptAnalyzerSettings.psd1'
          $r2 = Invoke-ModuleLint -ModulePath ./TAKInstall  -Settings $settings2
          $settings3 = './TAKDeploy/PSScriptAnalyzerSettings.psd1'
          $r3 = Invoke-ModuleLint -ModulePath ./TAKDeploy   -Settings $settings3
          $settings4 = './PSScriptAnalyzerSettings.psd1'
          $r4 = Invoke-ScriptAnalyzer -Path ./Deploy-TAKServer.ps1     -Settings $settings4
          $r5 = Invoke-ScriptAnalyzer -Path ./Deploy-TAKTestServer.ps1 -Settings $settings4

          $all = @($r1) + @($r2) + @($r3) + @($r4) + @($r5)
          if ($all) {
              $all | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize
              Write-Error "PSScriptAnalyzer reported $($all.Count) violation(s)."
              exit 1
          }
          Write-Host "PSScriptAnalyzer: no violations found."

  # ─── ShellCheck ─────────────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    needs: psscriptanalyzer
    steps:
      - uses: actions/checkout@v6

      - name: Run ShellCheck on InstallShellScripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './InstallShellScripts'
          severity: warning

  # ─── Live-VM integration tests (manual / release only) ─────────────────────
  #
  # This job runs the full integration + E2E test suite against a real deployed
  # TAK Server VM.  It is intentionally NOT triggered on normal push/PR runs
  # because it requires a self-hosted runner with network access to the VM.
  #
  # Trigger options:
  #   1. Manual:  workflow_dispatch with live_vm_host set.
  #   2. Release: push a tag matching 'v*' — uses self-hosted runner secrets.
  #
  # Required self-hosted runner secrets (set in repo Settings → Secrets):
  #   TAK_SSH_PASS   - SSH password for the TAK Server VM
  #   TAK_CERT_PASS  - PKCS#12 certificate password
  #
  live-vm-integration:
    name: Live-VM Integration Tests
    runs-on: [self-hosted, windows, tak-vm]
    # Only run when triggered manually with a host, or on tagged releases
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.live_vm_host != '') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v6

      - name: Install Pester and Posh-SSH
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester   -MinimumVersion 5.0 -Force -Scope CurrentUser
          Install-Module Posh-SSH -Force -Scope CurrentUser

      - name: Set target host (workflow_dispatch vs tagged release)
        id: target
        shell: pwsh
        run: |
          $host_ = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.live_vm_host }}'
          } else {
              '${{ vars.TAK_VM_HOST }}'
          }
          $sshUser = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.live_vm_ssh_user }}'
          } else {
              '${{ vars.TAK_SSH_USER }}'
          }
          echo "TAK_INTEGRATION_HOST=$host_"  | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "TAK_SSH_USER=$sshUser"         | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Run integration tests against live VM
        shell: pwsh
        env:
          TAK_INTEGRATION_HOST: ${{ env.TAK_INTEGRATION_HOST }}
          TAK_SSH_USER:         ${{ env.TAK_SSH_USER }}
          TAK_SSH_PASS:         ${{ secrets.TAK_SSH_PASS }}
          TAK_CERT_PASS:        ${{ secrets.TAK_CERT_PASS }}
        run: |
          $params = @{
              OutputPath = 'reports/TestResults-Integration-LiveVM.xml'
              PassThru   = $true
          }
          $tags = '${{ inputs.live_vm_tags }}'
          if ($tags -and $tags.Trim()) {
              $params['Tags'] = $tags -split '\s*,\s*'
          }
          $result = .\Invoke-IntegrationTests.ps1 @params
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Run E2E tests against live VM
        shell: pwsh
        env:
          TAK_INTEGRATION_HOST: ${{ env.TAK_INTEGRATION_HOST }}
          TAK_SSH_USER:         ${{ env.TAK_SSH_USER }}
          TAK_SSH_PASS:         ${{ secrets.TAK_SSH_PASS }}
          TAK_CERT_PASS:        ${{ secrets.TAK_CERT_PASS }}
        run: |
          $result = .\Invoke-E2ETests.ps1 `
              -XmlOutputPath      'reports/TestResults-E2E-LiveVM.xml' `
              -MarkdownOutputPath 'reports/TestResults-E2E-LiveVM.md' `
              -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }

      - name: Upload live-VM test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-vm-test-results
          path: reports/TestResults-*-LiveVM.*
